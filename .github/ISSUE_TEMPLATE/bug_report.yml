name: Bug report
description: Something behaves differently from what it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem — anything a hostile guest gets that it
        should not — please do **not** file it here. See
        [SECURITY.md](https://github.com/satishbabariya/swift-netstack/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, as precisely as you can put it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >
        If a document, a comment, or an RFC says otherwise, quoting it helps a
        lot — this project treats a claim that turns out to be wrong as a bug in
        its own right.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        Command line, code, or a sequence of frames. A reproduction is worth far
        more than a description; a failing test is worth more still.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.2.0, or a commit sha"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Swift version, and how the guest is attached.
      placeholder: "macOS 15.2, Swift 6.2, --listen-vfkit with Virtualization.framework"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, statistics, or a capture
      description: >
        `--debug` output, the `/stats` endpoint, or a pcap from `--pcap` if you
        have one. Optional, and often the thing that settles it.
      render: shell
