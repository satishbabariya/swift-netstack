name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # `Package.swift` declares swift-tools-version 6.2, so the runner needs a
    # toolchain at least that new. macos-14 ships Swift 5.10 and fails before it
    # compiles a line.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # The library AND the tests, warning-free.
      #
      # This used to cover the library alone, because the test target carried
      # fifty-five warnings from earlier work and failing on those would have
      # meant the useful half never got enabled. They are cleared, so the caveat
      # is gone -- and it mattered more than tidiness: twenty-seven NIO warnings
      # about scheduling on a dead event loop were dismissed as noise in this
      # repository, and one of them was a real leak.
      #
      # It has to be a fresh checkout to mean anything. An incremental
      # `swift build` reuses an already-compiled module and prints nothing at
      # all, which is how twelve warnings went unnoticed locally for several
      # weeks of work.
      - name: Build with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      # The differential tests now FAIL rather than skip when this binary is
      # missing, because a silent skip made them indistinguishable from a pass:
      # on a fresh checkout the M4 gate test used to succeed in a millisecond
      # having compared nothing. Building it here is what makes the differential
      # actually run in CI rather than merely exist.
      - uses: actions/setup-go@v5
        with:
          go-version-file: differential/harness/go.mod
          cache-dependency-path: differential/harness/go.sum

      - name: Build the differential harness
        run: go build -o harness .
        working-directory: differential/harness

      - name: Test
        # `set -o pipefail`, because piping into `tee` otherwise hands the
        # step `tee`'s exit status and a failing suite would go green. GitHub's
        # default shell is `bash -e`, which does not set it.
        #
        # The frame fuzzer gets a different seed every run, and more of them.
        #
        # It defaults to a fixed seed so a local run is reproducible, which meant
        # CI explored the same four thousand mutated frames on every build since
        # the day it was written: green after the first one by construction, and
        # unable to find anything new however long it ran. Five million frames
        # across five other seeds, run by hand, found nothing -- which is worth
        # something only because the seeds differed.
        #
        # A failure names its own seed and says to replay with
        # NETSTACK_FUZZ_SEED, so a red build here is reproducible on a laptop.
        env:
          NETSTACK_FUZZ_SEED: ${{ github.run_id }}
          NETSTACK_FUZZ_ITERATIONS: 50000
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log

      # The README states a test count. It was maintained by hand and was wrong
      # within a day.
      - name: Check the README's test count
        run: ./scripts/check-test-count.sh /tmp/swift-test.log

      # The full gate, not the 300 sequences `swift test` runs by default.
      #
      # The README says 10,000 randomised sequences agree with gVisor frame for
      # frame. Nothing verified that: the default is 300, and 10,000 was run
      # only when somebody remembered to ask. A claim checked by hand is a claim
      # that goes stale, and this one is the headline evidence for the whole
      # port. It takes about twenty seconds.
      #
      # The seed is fixed on purpose -- see `differentialSeed` -- so this is the
      # same ten thousand sequences every run and a regression cannot hide
      # behind a lucky draw.
      - name: The full differential gate
        run: NETSTACK_DIFFERENTIAL_SEQUENCES=10000 swift test --filter Differential

      # Deletes each guard in `scripts/guards.tsv` and requires that the named
      # test notices. Guards drift out from under their tests as code around
      # them changes, and nothing else here would say so.
      # The design conventions this package rests on: no locks, no direct clock
      # reads, no printing from a library, and the TCP state machine staying
      # behind its own surface. Cheap, and each was true when written and is
      # only true now because something checks.
      # `.swift-format` sat here unenforced with 657 findings against it,
      # because it was swift-format's defaults saved once and never reconciled
      # with the code. It describes the code now, and this keeps it that way.

  harness:
    name: Build the differential harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: differential/harness/go.mod
          cache-dependency-path: differential/harness/go.sum

      # Built, not run. The harness drives gVisor's real stack from the same
      # frames the Swift suite uses; a full seeded differential run is far too
      # slow for every push, but a harness that no longer compiles would
      # silently stop being available to anyone who did want to run one.
      - name: Build
        run: go build ./...
        working-directory: differential/harness

      - name: Vet
        run: go vet ./...
        working-directory: differential/harness

      # The interop module is Go too, and was getting neither of these.
      - name: Vet the interop driver
        run: go vet ./...
        working-directory: differential/interop

      - name: Check the Go formatting
        run: |
          unformatted="$(gofmt -l differential/harness differential/interop)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  linux:
    name: Build on Linux
    # Not a claimed platform: `Package.swift` names macOS and the README says
    # macOS 14+. This job exists to find out how far off Linux is, and to stop
    # it drifting further -- upstream runs on Linux, so anyone who wants this
    # port for podman on Linux starts from whatever state it happens to be in.
    #
    # `Sources/Netstack` imports Darwin in exactly two files and both guard it,
    # so the answer may be "it already works". It builds the library and the
    # executable; the tests are not run here because several of them open
    # unprivileged ICMP sockets and bind unix sockets in ways a container
    # restricts, and a red job for the sandbox rather than the code would teach
    # nobody anything.
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build the library and the program
        run: swift build

      # Compiled, not run. The test target's own portability is worth gating on
      # -- it did not compile here at all, for the same three reasons the
      # library did not -- while running the suite is a separate question: a
      # container restricts unprivileged ICMP and the ping tests would fail for
      # the sandbox rather than for the code.
      - name: Build the tests on Linux
        run: swift build --build-tests
      # The one check that cannot run on the machine this is developed on:
      # Darwin has no SOCK_SEQPACKET for AF_UNIX, so --listen-bess was written
      # against a manual page and this is the only place it is ever opened.
      #
      # The image has no python3, and the check needs one to be a guest. Without
      # this the script found no interpreter and reported the same "skipped" it
      # reports on a Mac -- green, in the only place the wire can be opened.
      - name: Install python3, which the check needs to be a guest
        run: apt-get update -qq && apt-get install -y -qq python3
      - name: One frame through the seqpacket wire
        run: ./scripts/bess-smoke.sh

  lint:
    name: Formatting, conventions and interop
    # Split out of `test` so the cheap checks answer in a minute rather than
    # waiting behind the suite and the differential gate.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The interop driver is Go. This came free in the old combined job, which
      # set Go up for the harness; splitting the job took it away and the
      # failure was `go: command not found` rather than anything about interop.
      - uses: actions/setup-go@v5
        with:
          go-version-file: differential/interop/go.mod
          cache-dependency-path: differential/interop/go.sum
      - name: Check the formatting
        run: ./scripts/format.sh

      - name: Check the conventions
        run: ./scripts/conventions.sh

      # Drives this gateway with gvisor-tap-vsock's own client library. Every
      # other comparison against upstream here depends on my having read
      # upstream correctly, and reading is what got `--listen` backwards and
      # missed `/services/dhcp/leases`.
      - name: Interoperate with upstream's client
        run: ./scripts/interop.sh

      # The interop check talks to the control plane, and a gateway that has
      # come up wrong can answer its control socket perfectly well. One frame
      # through the wire is the check that watches what a guest actually gets.
      - name: One frame through the built executable
        run: ./scripts/frame-smoke.sh

      # Twenty seconds of mixed traffic, asking what the gateway is holding
      # rather than what it answers: single-shot checks cannot see a descriptor
      # leaked per connection or memory that climbs.
      - name: A gateway under sustained traffic
        run: ./scripts/soak.sh

  guards:
    name: Falsify the guards
    # Its own job because it is the long pole: seventeen mutations, each with a
    # build and a filtered test run. Nothing else needs to wait for it, and it
    # needs nothing from anything else.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Falsify the guards
        run: ./scripts/falsify.sh --all
